<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Interactive Tournament Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.95;
        }

        .mode-indicator {
            display: inline-block;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            margin-top: 10px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .mode-indicator.admin {
            background: #ff6b6b;
        }

        .mode-indicator.viewer {
            background: #51cf66;
        }

        .sync-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            margin-left: 20px;
            font-size: 0.9em;
            font-weight: 600;
        }

        .sync-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #51cf66;
            animation: pulse 2s infinite;
        }

        .sync-dot.syncing {
            background: #ffd700;
            animation: pulse 1s infinite;
        }

        .sync-dot.error {
            background: #ff6b6b;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .tab-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-weight: 600;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tab-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* FORM SECTION */
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            flex: 1;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 0.9em;
        }

        .btn-success {
            background: #51cf66;
            color: white;
        }

        .btn-success:hover {
            background: #40c057;
        }

        .btn-danger {
            background: #ff6b6b;
            color: white;
        }

        .btn-danger:hover {
            background: #ff5252;
        }

        /* MESSAGES */
        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            animation: slideIn 0.3s;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* STANDINGS */
        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .group-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .group-card:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            transform: translateY(-3px);
        }

        .group-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-weight: 700;
            font-size: 1.1em;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
        }

        .group-table thead {
            background: #f8f9fa;
        }

        .group-table th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #667eea;
        }

        .group-table td {
            padding: 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .group-table tbody tr:hover {
            background: #f8f9fa;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 700;
            color: white;
            font-size: 0.9em;
            margin-right: 10px;
        }

        .rank-1 { background: #ffd700; color: #333; }
        .rank-2 { background: #c0c0c0; color: #333; }
        .rank-3 { background: #cd7f32; }

        /* MATCHES/SCHEDULE */
        .matches-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .round-section {
            margin-bottom: 40px;
        }

        .round-title {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-title::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 30px;
            background: #667eea;
            border-radius: 2px;
        }

        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
        }

        .match-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .match-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .match-card.completed {
            background: #e8f5e9;
            border-color: #51cf66;
        }

        .match-number {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .match-team {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 1.05em;
            font-weight: 600;
        }

        .match-team.team1 {
            border-bottom: 1px solid #ddd;
            margin-bottom: 12px;
        }

        .match-team-name {
            flex: 1;
        }

        .match-score-input {
            width: 60px;
            padding: 8px;
            font-size: 1.1em;
            text-align: center;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-weight: 700;
            margin-left: 10px;
        }

        .match-score-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .match-score-display {
            background: #667eea;
            color: white;
            padding: 6px 12px;
            border-radius: 5px;
            font-weight: 700;
            margin-left: 10px;
            min-width: 60px;
            text-align: center;
        }

        .match-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .match-actions .btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9em;
        }

        .group-label {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            margin-top: 10px;
        }

        /* LOADING STATE */
        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .groups-container {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }

            .sync-status {
                margin-left: 0;
                margin-top: 10px;
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Tournament Tracker</h1>
            <p>Real-time scoring with Google Sheets sync</p>
            <div class="mode-indicator" id="modeIndicator">Loading...</div>
            <div class="sync-status">
                <span class="sync-dot" id="syncDot"></span>
                <span id="syncStatus">Connecting...</span>
            </div>
        </div>

        <!-- MESSAGES -->
        <div id="messageContainer"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="standingsTab" onclick="switchTab('standings')" disabled>📊 Standings</button>
            <button class="tab-btn" id="scheduleTab" onclick="switchTab('schedule')" disabled>📅 Schedule</button>
        </div>

        <!-- LOGIN TAB -->
        <div id="login" class="tab-content active">
            <div class="form-section">
                <h2 style="margin-bottom: 20px; color: #333;">Tournament Access</h2>
                <p style="margin-bottom: 20px; color: #666;">Choose your role to continue</p>

                <div class="button-group" style="margin-top: 30px;">
                    <button class="btn btn-primary" onclick="showAdminLogin()">🔐 Admin Login</button>
                    <button class="btn btn-primary" onclick="loginAsViewer()">👁️ View Only (Live Scores)</button>
                </div>

                <div id="adminLoginForm" style="display: none; margin-top: 30px; padding-top: 30px; border-top: 2px solid #e0e0e0;">
                    <div class="form-group">
                        <label>Admin Password</label>
                        <input type="password" id="adminPassword" placeholder="Enter admin password" onkeypress="if(event.key==='Enter') completeAdminLogin()">
                    </div>
                    <div class="button-group">
                        <button class="btn btn-primary" onclick="completeAdminLogin()">Login</button>
                        <button class="btn btn-secondary" onclick="cancelAdminLogin()">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- STANDINGS TAB -->
        <div id="standings" class="tab-content">
            <div id="standingsContent" class="empty-state">
                <div class="empty-state-icon">📊</div>
                <p>Loading standings...</p>
            </div>
        </div>

        <!-- SCHEDULE TAB -->
        <div id="schedule" class="tab-content">
            <div id="scheduleContent" class="empty-state">
                <div class="empty-state-icon">📅</div>
                <p>Loading schedule...</p>
            </div>
        </div>
    </div>

    <script>
        // Configuration
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz_rrVI2ticbTWZ-KQZfH0URXshb63XcO23kRaZ3XU_Mo23-ecu6okFMY0j3MjrpRL2mw/exec';
        const ADMIN_PASSWORD = 'admin123'; // CHANGE THIS!
        const AUTO_SYNC_INTERVAL = 3000; // 3 seconds

        // State
        let currentMode = null;
        let tournamentData = null;
        let syncTimer = null;

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            checkExistingSession();
            startAutoSync();
        });

        // ==================== AUTH ====================
        function checkExistingSession() {
            const savedMode = localStorage.getItem('userMode');
            if (savedMode === 'admin') {
                currentMode = 'admin';
                updateModeIndicator();
                enableTabs();
                loadTournamentData();
            } else if (savedMode === 'viewer') {
                currentMode = 'viewer';
                updateModeIndicator();
                enableTabs();
                loadTournamentData();
            }
        }

        function showAdminLogin() {
            document.getElementById('adminLoginForm').style.display = 'block';
            document.getElementById('adminPassword').focus();
        }

        function cancelAdminLogin() {
            document.getElementById('adminLoginForm').style.display = 'none';
            document.getElementById('adminPassword').value = '';
        }

        function completeAdminLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                currentMode = 'admin';
                localStorage.setItem('userMode', 'admin');
                updateModeIndicator();
                enableTabs();
                loadTournamentData();
                showMessage('Admin logged in successfully!', 'success');
                switchTab('standings');
                document.getElementById('adminLoginForm').style.display = 'none';
            } else {
                showMessage('Invalid password!', 'error');
                document.getElementById('adminPassword').value = '';
            }
        }

        function loginAsViewer() {
            currentMode = 'viewer';
            localStorage.setItem('userMode', 'viewer');
            updateModeIndicator();
            enableTabs();
            loadTournamentData();
            showMessage('Connected as viewer - Live scores updating...', 'info');
            switchTab('standings');
        }

        function updateModeIndicator() {
            const indicator = document.getElementById('modeIndicator');
            if (currentMode === 'admin') {
                indicator.className = 'mode-indicator admin';
                indicator.textContent = '🔐 ADMIN MODE';
            } else if (currentMode === 'viewer') {
                indicator.className = 'mode-indicator viewer';
                indicator.textContent = '👁️ VIEWER MODE (Live)';
            }
        }

        function enableTabs() {
            document.getElementById('standingsTab').disabled = false;
            document.getElementById('scheduleTab').disabled = false;
        }

        // ==================== UI FUNCTIONS ====================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function showMessage(text, type = 'info') {
            const container = document.getElementById('messageContainer');
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            container.appendChild(msg);

            setTimeout(() => msg.remove(), 5000);
        }

        function updateSyncStatus(status, isError = false) {
            const dot = document.getElementById('syncDot');
            const statusText = document.getElementById('syncStatus');

            dot.className = 'sync-dot';
            if (isError) dot.classList.add('error');
            else if (status === 'syncing') dot.classList.add('syncing');

            statusText.textContent = status.charAt(0).toUpperCase() + status.slice(1);
        }

        // ==================== DATA FUNCTIONS ====================
        async function loadTournamentData() {
            updateSyncStatus('syncing');
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL + '?action=getAll');
                const data = await response.json();

                if (data.success) {
                    tournamentData = data;
                    displayStandings();
                    displaySchedule();
                    updateSyncStatus('synced');
                } else {
                    throw new Error(data.message || 'Failed to load data');
                }
            } catch (error) {
                console.error('Load error:', error);
                updateSyncStatus('offline', true);
                showMessage(`Sync error: ${error.message}`, 'error');
            }
        }

        async function updateScore(matchId, team1Score, team2Score) {
            if (!currentMode || currentMode !== 'admin') {
                showMessage('Only admins can update scores', 'error');
                return;
            }

            updateSyncStatus('syncing');
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'updateScore',
                        matchId: matchId,
                        team1Score: parseInt(team1Score),
                        team2Score: parseInt(team2Score)
                    })
                });

                const data = await response.json();

                if (data.success) {
                    showMessage('Score updated!', 'success');
                    loadTournamentData();
                } else {
                    throw new Error(data.message || 'Failed to update score');
                }
            } catch (error) {
                console.error('Update error:', error);
                updateSyncStatus('offline', true);
                showMessage(`Update error: ${error.message}`, 'error');
            }
        }

        // ==================== DISPLAY FUNCTIONS ====================
        function displayStandings() {
            const container = document.getElementById('standingsContent');

            if (!tournamentData || !tournamentData.standings) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div><p>No standings data available</p></div>';
                return;
            }

            let html = '<div class="groups-container">';

            for (const groupId in tournamentData.standings) {
                const teams = tournamentData.standings[groupId];
                if (!teams || teams.length === 0) continue;

                html += `
                    <div class="group-card">
                        <div class="group-header">Group ${groupId}</div>
                        <table class="group-table">
                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Team</th>
                                    <th>W</th>
                                    <th>L</th>
                                    <th>PF</th>
                                    <th>PA</th>
                                    <th>Pts</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                teams.forEach((team, index) => {
                    const pointDiff = (team.pointsFor || 0) - (team.pointsAgainst || 0);
                    let badgeClass = '';
                    if (index === 0) badgeClass = 'rank-1';
                    else if (index === 1) badgeClass = 'rank-2';
                    else if (index === 2) badgeClass = 'rank-3';

                    html += `
                        <tr>
                            <td>
                                ${badgeClass ? `<span class="rank-badge ${badgeClass}">${index + 1}</span>` : index + 1}
                            </td>
                            <td><strong>${team.name}</strong></td>
                            <td>${team.wins || 0}</td>
                            <td>${team.losses || 0}</td>
                            <td>${team.pointsFor || 0}</td>
                            <td>${team.pointsAgainst || 0}</td>
                            <td><strong>${team.totalPoints || 0}</strong></td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function displaySchedule() {
            const container = document.getElementById('scheduleContent');

            if (!tournamentData || !tournamentData.schedule || tournamentData.schedule.length === 0) {
                container.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📅</div><p>No schedule data available</p></div>';
                return;
            }

            const schedule = tournamentData.schedule;
            const roundedMatches = {};

            // Group matches by round
            schedule.forEach(match => {
                const round = match.round || 1;
                if (!roundedMatches[round]) roundedMatches[round] = [];
                roundedMatches[round].push(match);
            });

            let html = '<div class="matches-container">';

            for (const round in roundedMatches) {
                const matches = roundedMatches[round];
                html += `<div class="round-section"><div class="round-title">Round ${round}</div><div class="matches-grid">`;

                matches.forEach(match => {
                    const isCompleted = match.team1Score !== null && match.team2Score !== null;
                    const cardClass = isCompleted ? 'match-card completed' : 'match-card';

                    html += `
                        <div class="${cardClass}">
                            <div class="match-number">Match #${match.matchId || 'N/A'}</div>
                            <div class="match-team team1">
                                <span class="match-team-name">${match.team1Name || 'TBD'}</span>
                                ${currentMode === 'admin' && !isCompleted ? `
                                    <input type="number" class="match-score-input" id="score1_${match.matchId}" placeholder="0" min="0">
                                ` : `
                                    <span class="match-score-display">${match.team1Score !== null ? match.team1Score : '-'}</span>
                                `}
                            </div>
                            <div class="match-team team2">
                                <span class="match-team-name">${match.team2Name || 'TBD'}</span>
                                ${currentMode === 'admin' && !isCompleted ? `
                                    <input type="number" class="match-score-input" id="score2_${match.matchId}" placeholder="0" min="0">
                                ` : `
                                    <span class="match-score-display">${match.team2Score !== null ? match.team2Score : '-'}</span>
                                `}
                            </div>
                            <div class="group-label">Group ${match.group || 'N/A'}</div>
                            ${currentMode === 'admin' && !isCompleted ? `
                                <div class="match-actions">
                                    <button class="btn btn-success btn-small" onclick="submitScore(${match.matchId})">Save Score</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += '</div></div>';
            }

            html += '</div>';
            container.innerHTML = html;
        }

        function submitScore(matchId) {
            const score1 = document.getElementById(`score1_${matchId}`).value;
            const score2 = document.getElementById(`score2_${matchId}`).value;

            if (score1 === '' || score2 === '') {
                showMessage('Please enter both scores', 'error');
                return;
            }

            updateScore(matchId, score1, score2);
        }

        // ==================== AUTO SYNC ====================
        function startAutoSync() {
            syncTimer = setInterval(() => {
                if (currentMode) {
                    loadTournamentData();
                }
            }, AUTO_SYNC_INTERVAL);
        }

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (syncTimer) clearInterval(syncTimer);
        });
    </script>
</body>
</html>
