<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournament Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        /* TABS */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s;
            font-weight: 600;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
        }

        .tab-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.3s;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* INPUT FORM */
        .form-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }

        input[type="text"],
        input[type="number"],
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
            font-family: monospace;
        }

        .teams-input-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .teams-input-group {
                grid-template-columns: 1fr;
            }
        }

        .team-item {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .team-item input {
            flex: 1;
        }

        .btn-remove {
            padding: 10px 15px;
            background: #ff6b6b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-remove:hover {
            background: #ff5252;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .btn-add {
            background: #51cf66;
            color: white;
            margin-top: 10px;
        }

        .btn-add:hover {
            background: #40c057;
        }

        /* TOURNAMENT DISPLAY */
        .tournament-display {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        .tournament-title {
            font-size: 2em;
            color: #333;
            margin-bottom: 30px;
            border-bottom: 3px solid #667eea;
            padding-bottom: 15px;
        }

        /* ROUNDS */
        .round-section {
            margin-bottom: 40px;
        }

        .round-header {
            font-size: 1.5em;
            color: #667eea;
            margin-bottom: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-header::before {
            content: '';
            display: inline-block;
            width: 4px;
            height: 30px;
            background: #667eea;
            border-radius: 2px;
        }

        .round-info {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f0f4ff;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .round-info-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .round-info-label {
            font-weight: 600;
            color: #667eea;
        }

        .round-info-value {
            color: #333;
            font-weight: 700;
        }

        /* STANDINGS */
        .standings-table {
            width: 100%;
            margin-bottom: 30px;
            border-collapse: collapse;
            background: white;
        }

        .standings-table thead {
            background: #f8f9fa;
        }

        .standings-table th {
            padding: 15px;
            text-align: left;
            font-weight: 700;
            color: #333;
            border-bottom: 2px solid #667eea;
        }

        .standings-table td {
            padding: 12px 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .standings-table tbody tr:hover {
            background: #f8f9fa;
        }

        .rank-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-weight: 700;
            color: white;
            font-size: 0.9em;
        }

        .rank-1 { background: #ffd700; color: #333; }
        .rank-2 { background: #c0c0c0; color: #333; }
        .rank-3 { background: #cd7f32; }

        /* GROUP DISPLAY */
        .groups-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }

        .group-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }

        .group-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.2);
            transform: translateY(-3px);
        }

        .group-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            font-weight: 700;
            font-size: 1.1em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .group-badge {
            background: rgba(255, 255, 255, 0.3);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .group-table {
            width: 100%;
            border-collapse: collapse;
        }

        .group-table thead {
            background: #e8eaf6;
        }

        .group-table th {
            padding: 10px;
            text-align: left;
            font-size: 0.85em;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #667eea;
        }

        .group-table td {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            font-size: 0.9em;
        }

        .group-table tbody tr:hover {
            background: #f5f7ff;
        }

        /* KNOCKOUT BRACKET */
        .bracket-container {
            overflow-x: auto;
            margin: 30px 0;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
        }

        .bracket {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            min-width: min-content;
            align-items: flex-start;
        }

        .bracket-round {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            min-width: 180px;
        }

        .bracket-round-label {
            text-align: center;
            font-weight: 700;
            color: #667eea;
            margin-bottom: 15px;
            font-size: 0.9em;
            text-transform: uppercase;
        }

        .bracket-match {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
            margin: 8px 0;
            transition: all 0.3s;
        }

        .bracket-match:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        }

        .bracket-match.complete {
            background: #f0f9ff;
            border-color: #667eea;
        }

        .bracket-match.bye {
            background: #f5f5f5;
            opacity: 0.6;
        }

        .bracket-match-team {
            padding: 10px;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
            font-weight: 500;
        }

        .bracket-match-team:last-child {
            border-bottom: none;
        }

        .bracket-match-team.winner {
            background: #e8f5e9;
            color: #2e7d32;
            font-weight: 700;
        }

        .bracket-score {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.85em;
        }

        /* MATCHES */
        .matches-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .match-card {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            transition: all 0.3s;
        }

        .match-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .match-number {
            font-size: 0.9em;
            color: #999;
            margin-bottom: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .match-team {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 1.05em;
            font-weight: 600;
        }

        .match-team.team1 {
            border-bottom: 1px solid #ddd;
            margin-bottom: 12px;
        }

        .match-team.winner {
            color: #51cf66;
            font-weight: 700;
        }

        .match-score {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 5px;
            font-size: 0.9em;
            font-weight: 700;
        }

        .match-vs {
            text-align: center;
            color: #999;
            font-weight: 700;
            font-size: 0.85em;
            margin: 5px 0;
        }

        .score-input-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .score-input-group input {
            flex: 1;
            padding: 8px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            text-align: center;
            font-size: 1em;
        }

        .btn-set-score {
            padding: 8px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .btn-set-score:hover {
            background: #5568d3;
        }

        /* EMPTY STATE */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 3em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        /* RESPONSIVE */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .matches-grid {
                grid-template-columns: 1fr;
            }

            .groups-container {
                grid-template-columns: 1fr;
            }

            .standings-table {
                font-size: 0.9em;
            }

            .standings-table th,
            .standings-table td {
                padding: 10px 8px;
            }

            .button-group {
                flex-direction: column;
            }

            .teams-input-group {
                grid-template-columns: 1fr;
            }

            .bracket-container {
                overflow-x: auto;
                padding: 10px;
            }

            .bracket-round {
                min-width: 140px;
            }
        }

        /* MESSAGES */
        .message {
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 600;
            animation: slideIn 0.3s;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-value {
            font-size: 2em;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .export-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn-export {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .btn-export:hover {
            background: #5568d3;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .view-btn {
            padding: 10px 20px;
            background: #e0e0e0;
            color: #333;
            border: 2px solid #ccc;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .view-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .view-btn:hover {
            border-color: #667eea;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚽ Tournament Tracker</h1>
            <p>Create, manage, and track tournament results with live standings</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('setup')">Setup</button>
            <button class="tab-btn" onclick="switchTab('tournament')">Tournament</button>
            <button class="tab-btn" onclick="switchTab('standings')">Standings</button>
        </div>

        <!-- SETUP TAB -->
        <div id="setup" class="tab-content active">
            <div class="form-section">
                <h2 style="margin-bottom: 20px; color: #333;">Tournament Setup</h2>

                <div class="form-group">
                    <label>Tournament Name</label>
                    <input type="text" id="tournamentName" placeholder="e.g., Regional Championship 2024" value="Regional Championship">
                </div>

                <div class="form-group">
                    <label>Number of Rounds</label>
                    <input type="number" id="numRounds" min="1" max="10" value="2">
                </div>

                <div class="form-group">
                    <label>Format for Each Round</label>
                    <div id="roundFormats"></div>
                </div>

                <div class="form-group">
                    <label>Number of Groups (for Pool Play)</label>
                    <input type="number" id="numGroups" min="1" max="8" value="1">
                </div>

                <hr style="margin: 30px 0; border: 1px solid #e0e0e0;">

                <h3 style="margin-bottom: 20px; color: #333;">Teams</h3>
                <div class="teams-input-group" id="teamsContainer"></div>
                <button class="btn btn-add" onclick="addTeamInput()">+ Add Team</button>

                <div class="button-group" style="margin-top: 30px;">
                    <button class="btn btn-primary" onclick="createTournament()">Create Tournament</button>
                    <button class="btn btn-secondary" onclick="resetForm()">Reset</button>
                </div>
            </div>
        </div>

        <!-- TOURNAMENT TAB -->
        <div id="tournament" class="tab-content">
            <div id="tournamentContent" class="empty-state">
                <div class="empty-state-icon">🏆</div>
                <p>Create a tournament to see matches and standings</p>
            </div>
        </div>

        <!-- STANDINGS TAB -->
        <div id="standings" class="tab-content">
            <div id="standingsContent" class="empty-state">
                <div class="empty-state-icon">📊</div>
                <p>Tournament standings will appear here</p>
            </div>
        </div>
    </div>

    <script>
        let tournament = null;

        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');
        }

        function updateRoundFormats() {
            const numRounds = parseInt(document.getElementById('numRounds').value) || 1;
            const container = document.getElementById('roundFormats');
            container.innerHTML = '';

            const formats = ['round-robin', 'single-elimination', 'double-elimination', 'swiss-system', 'pool-play'];

            for (let i = 1; i <= numRounds; i++) {
                const formGroup = document.createElement('div');
                formGroup.className = 'form-group';
                formGroup.innerHTML = `
                    <label>Round ${i} Format</label>
                    <select id="roundFormat${i}">
                        ${formats.map(f => `<option value="${f}">${f.replace(/-/g, ' ').toUpperCase()}</option>`).join('')}
                    </select>
                `;
                container.appendChild(formGroup);
            }
        }

        document.getElementById('numRounds').addEventListener('change', updateRoundFormats);

        function addTeamInput() {
            const container = document.getElementById('teamsContainer');
            const teamItem = document.createElement('div');
            teamItem.className = 'team-item';
            teamItem.innerHTML = `
                <input type="text" placeholder="Team name" class="team-input">
                <button class="btn-remove" onclick="this.parentElement.remove()">Remove</button>
            `;
            container.appendChild(teamItem);
        }

        function resetForm() {
            document.getElementById('tournamentName').value = 'Regional Championship';
            document.getElementById('numRounds').value = 2;
            document.getElementById('numGroups').value = 1;
            document.getElementById('teamsContainer').innerHTML = '';
            for (let i = 0; i < 4; i++) addTeamInput();
            updateRoundFormats();
        }

        function createTournament() {
            const name = document.getElementById('tournamentName').value.trim();
            const numRounds = parseInt(document.getElementById('numRounds').value);
            const numGroups = parseInt(document.getElementById('numGroups').value);
            const teams = Array.from(document.querySelectorAll('.team-input'))
                .map(input => input.value.trim())
                .filter(t => t);

            if (!name) {
                alert('Please enter a tournament name');
                return;
            }

            if (teams.length < 2) {
                alert('Please add at least 2 teams');
                return;
            }

            const formats = [];
            for (let i = 1; i <= numRounds; i++) {
                const format = document.getElementById(`roundFormat${i}`).value;
                formats.push(format);
            }

            tournament = new Tournament(name, teams, formats, numGroups);
            displayTournament();
            switchTab('tournament');
            showMessage('Tournament created successfully!', 'success');
        }

        class Tournament {
            constructor(name, teams, formats, numGroups = 1) {
                this.name = name;
                this.teams = teams;
                this.formats = formats;
                this.numGroups = numGroups;
                this.rounds = [];
                this.standings = {};
                
                // Initialize standings
                teams.forEach(team => {
                    this.standings[team] = {
                        wins: 0,
                        losses: 0,
                        points: 0,
                        matches: 0,
                        group: null
                    };
                });

                this.generateTournament();
            }

            generateTournament() {
                let currentTeams = [...this.teams];

                for (let roundNum = 0; roundNum < this.formats.length; roundNum++) {
                    const format = this.formats[roundNum];
                    
                    let roundData = {
                        number: roundNum + 1,
                        format: format,
                        matches: [],
                        groups: []
                    };

                    if (format === 'pool-play' && this.numGroups > 1) {
                        roundData.groups = this.generateGroupStage(currentTeams, this.numGroups, roundNum + 1);
                        roundData.matches = this.getMatchesFromGroups(roundData.groups);
                    } else {
                        roundData.matches = this.generateMatches(currentTeams, format, roundNum + 1);
                    }

                    this.rounds.push(roundData);

                    // For next round, keep top teams based on standings
                    if (roundNum < this.formats.length - 1) {
                        const sorted = currentTeams.sort((a, b) => 
                            this.standings[b].points - this.standings[a].points
                        );
                        // Keep top 50% or at least half rounded up
                        const keepCount = Math.ceil(sorted.length / 2);
                        currentTeams = sorted.slice(0, keepCount);
                    }
                }
            }

            generateGroupStage(teams, numGroups, roundNum) {
                const groups = [];
                const teamsPerGroup = Math.ceil(teams.length / numGroups);
                const shuffled = [...teams].sort(() => Math.random() - 0.5);

                for (let g = 0; g < numGroups; g++) {
                    const groupTeams = shuffled.slice(g * teamsPerGroup, (g + 1) * teamsPerGroup);
                    const groupMatches = [];
                    let matchNum = 1;

                    for (let i = 0; i < groupTeams.length; i++) {
                        for (let j = i + 1; j < groupTeams.length; j++) {
                            groupMatches.push({
                                id: `${roundNum}-G${g + 1}-${matchNum}`,
                                number: matchNum,
                                team1: groupTeams[i],
                                team2: groupTeams[j],
                                score1: null,
                                score2: null,
                                winner: null
                            });
                            matchNum++;
                        }
                    }

                    groups.push({
                        name: `Group ${String.fromCharCode(65 + g)}`,
                        teams: groupTeams,
                        matches: groupMatches
                    });

                    groupTeams.forEach(team => {
                        this.standings[team].group = `Group ${String.fromCharCode(65 + g)}`;
                    });
                }

                return groups;
            }

            getMatchesFromGroups(groups) {
                const matches = [];
                groups.forEach(group => {
                    matches.push(...group.matches);
                });
                return matches;
            }

            generateMatches(teams, format, roundNum) {
                const matches = [];
                let matchNum = 1;

                if (format === 'round-robin' || format === 'pool-play') {
                    for (let i = 0; i < teams.length; i++) {
                        for (let j = i + 1; j < teams.length; j++) {
                            matches.push({
                                id: `${roundNum}-${matchNum}`,
                                number: matchNum,
                                team1: teams[i],
                                team2: teams[j],
                                score1: null,
                                score2: null,
                                winner: null
                            });
                            matchNum++;
                        }
                    }
                } else if (format === 'single-elimination') {
                    const paired = this.pairTeams(teams);
                    paired.forEach(pair => {
                        matches.push({
                            id: `${roundNum}-${matchNum}`,
                            number: matchNum,
                            team1: pair[0],
                            team2: pair[1],
                            score1: null,
                            score2: null,
                            winner: null
                        });
                        matchNum++;
                    });
                } else if (format === 'double-elimination' || format === 'swiss-system') {
                    const paired = this.pairTeams(teams);
                    paired.forEach(pair => {
                        matches.push({
                            id: `${roundNum}-${matchNum}`,
                            number: matchNum,
                            team1: pair[0],
                            team2: pair[1],
                            score1: null,
                            score2: null,
                            winner: null
                        });
                        matchNum++;
                    });
                }

                return matches;
            }

            pairTeams(teams) {
                const shuffled = [...teams].sort(() => Math.random() - 0.5);
                const pairs = [];
                for (let i = 0; i < shuffled.length - 1; i += 2) {
                    pairs.push([shuffled[i], shuffled[i + 1]]);
                }
                return pairs;
            }

            setScore(roundNum, matchId, score1, score2) {
                const round = this.rounds[roundNum - 1];
                const match = round.matches.find(m => m.id === matchId);

                if (!match) return false;

                match.score1 = parseInt(score1) || 0;
                match.score2 = parseInt(score2) || 0;

                // Determine winner
                if (match.score1 > match.score2) {
                    match.winner = match.team1;
                } else if (match.score2 > match.score1) {
                    match.winner = match.team2;
                } else {
                    match.winner = 'tie';
                }

                // Update standings
                const team1Stats = this.standings[match.team1];
                const team2Stats = this.standings[match.team2];

                if (match.winner === match.team1) {
                    team1Stats.wins++;
                    team2Stats.losses++;
                    team1Stats.points += 2;
                } else if (match.winner === match.team2) {
                    team2Stats.wins++;
                    team1Stats.losses++;
                    team2Stats.points += 2;
                } else {
                    team1Stats.points += 1;
                    team2Stats.points += 1;
                }

                team1Stats.matches++;
                team2Stats.matches++;

                return true;
            }

            getStandings() {
                return Object.entries(this.standings)
                    .map(([team, stats]) => ({ team, ...stats }))
                    .sort((a, b) => {
                        if (b.points !== a.points) return b.points - a.points;
                        if (b.wins !== a.wins) return b.wins - a.wins;
                        return 0;
                    });
            }
        }

        function displayTournament() {
            if (!tournament) return;

            const content = document.getElementById('tournamentContent');
            const stats = tournament.getStandings();

            let html = `
                <div class="tournament-display">
                    <div class="tournament-title">${tournament.name}</div>

                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value">${tournament.teams.length}</div>
                            <div class="stat-label">Teams</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${tournament.rounds.length}</div>
                            <div class="stat-label">Rounds</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${tournament.rounds.reduce((sum, r) => sum + r.matches.length, 0)}</div>
                            <div class="stat-label">Total Matches</div>
                        </div>
                    </div>

                    <div class="export-controls">
                        <button class="btn-export" onclick="exportTournament()">📥 Export as JSON</button>
                        <button class="btn-export" onclick="printTournament()">🖨️ Print</button>
                    </div>
            `;

            tournament.rounds.forEach((round, roundIdx) => {
                html += `
                    <div class="round-section">
                        <div class="round-header">Round ${round.number} - ${round.format.replace(/-/g, ' ').toUpperCase()}</div>
                        <div class="round-info">
                            <div class="round-info-item">
                                <span class="round-info-label">Matches:</span>
                                <span class="round-info-value">${round.matches.length}</span>
                            </div>
                            ${round.groups.length > 0 ? `
                                <div class="round-info-item">
                                    <span class="round-info-label">Groups:</span>
                                    <span class="round-info-value">${round.groups.length}</span>
                                </div>
                            ` : ''}
                            <div class="round-info-item">
                                <span class="round-info-label">Format:</span>
                                <span class="round-info-value">${round.format.replace(/-/g, ' ')}</span>
                            </div>
                        </div>
                `;

                // Display groups if they exist
                if (round.groups.length > 0) {
                    html += displayGroupStage(round);
                } else if (round.format === 'single-elimination' || round.format === 'double-elimination') {
                    html += displayKnockoutBracket(round);
                } else {
                    html += displayMatches(round);
                }

                html += `
                    </div>
                `;
            });

            html += `
                </div>
            `;

            content.innerHTML = html;
        }

        function displayGroupStage(round) {
            let html = `<div class="groups-container">`;

            round.groups.forEach((group, groupIdx) => {
                const groupStandings = group.teams
                    .map(team => {
                        const stats = tournament.standings[team];
                        const groupMatches = group.matches.filter(m => 
                            (m.team1 === team || m.team2 === team) && m.winner !== null
                        );
                        let points = 0, wins = 0, losses = 0, matches = 0;
                        
                        groupMatches.forEach(match => {
                            matches++;
                            if (match.winner === team) {
                                wins++;
                                points += 2;
                            } else if (match.winner === 'tie') {
                                points += 1;
                            } else {
                                losses++;
                            }
                        });

                        return { team, points, wins, losses, matches };
                    })
                    .sort((a, b) => {
                        if (b.points !== a.points) return b.points - a.points;
                        if (b.wins !== a.wins) return b.wins - a.wins;
                        return 0;
                    });

                html += `
                    <div class="group-card">
                        <div class="group-header">
                            ${group.name}
                            <span class="group-badge">${group.teams.length} Teams</span>
                        </div>
                        <table class="group-table">
                            <thead>
                                <tr>
                                    <th>Rank</th>
                                    <th>Team</th>
                                    <th>M</th>
                                    <th>W</th>
                                    <th>L</th>
                                    <th>Pts</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                groupStandings.forEach((entry, idx) => {
                    const rankClass = idx < 3 ? `rank-${idx + 1}` : '';
                    html += `
                        <tr>
                            <td>
                                ${idx < 3 ? `<span class="rank-badge ${rankClass}">${idx + 1}</span>` : `<strong>${idx + 1}</strong>`}
                            </td>
                            <td><strong>${entry.team}</strong></td>
                            <td>${entry.matches}</td>
                            <td style="color: #51cf66; font-weight: 600;">${entry.wins}</td>
                            <td style="color: #ff6b6b; font-weight: 600;">${entry.losses}</td>
                            <td style="color: #667eea; font-weight: 700;">${entry.points}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                        <div style="margin-top: 15px;">
                            <strong style="display: block; margin-bottom: 10px; color: #333;">Matches:</strong>
                `;

                group.matches.forEach(match => {
                    const isComplete = match.winner !== null;
                    const team1Class = match.winner === match.team1 ? 'winner' : '';
                    const team2Class = match.winner === match.team2 ? 'winner' : '';

                    html += `
                        <div class="match-card" style="padding: 12px;">
                            <div class="match-team team1 ${team1Class}">
                                <span>${match.team1}</span>
                                ${match.score1 !== null ? `<span class="match-score">${match.score1}</span>` : ''}
                            </div>
                            <div class="match-vs">vs</div>
                            <div class="match-team ${team2Class}">
                                <span>${match.team2}</span>
                                ${match.score2 !== null ? `<span class="match-score">${match.score2}</span>` : ''}
                            </div>
                            <div class="score-input-group" style="margin-top: 10px;">
                                <input type="number" id="score1_${match.id}" placeholder="Team 1" min="0" value="${match.score1 !== null ? match.score1 : ''}">
                                <input type="number" id="score2_${match.id}" placeholder="Team 2" min="0" value="${match.score2 !== null ? match.score2 : ''}">
                                <button class="btn-set-score" onclick="setMatchScore(${round.number}, '${match.id}')">Set</button>
                            </div>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            return html;
        }

        function displayKnockoutBracket(round) {
            let html = `
                <div class="bracket-container">
                    <div class="bracket">
                        <div class="bracket-round">
                            <div class="bracket-round-label">Round of ${round.matches.length * 2}</div>
            `;

            round.matches.forEach((match, idx) => {
                const isComplete = match.winner !== null;
                const isBye = match.team2 === '(BYE)' || match.team1 === '(BYE)';
                
                html += `
                    <div class="bracket-match ${isComplete ? 'complete' : ''} ${isBye ? 'bye' : ''}">
                        <div class="bracket-match-team ${match.winner === match.team1 ? 'winner' : ''}">
                            <span>${match.team1}</span>
                            ${match.score1 !== null ? `<span class="bracket-score">${match.score1}</span>` : ''}
                        </div>
                        <div class="bracket-match-team ${match.winner === match.team2 ? 'winner' : ''}">
                            <span>${match.team2}</span>
                            ${match.score2 !== null ? `<span class="bracket-score">${match.score2}</span>` : ''}
                        </div>
                    </div>
                `;
            });

            html += `
                        </div>
                    </div>
                </div>

                <div class="matches-grid">
            `;

            round.matches.forEach(match => {
                const isComplete = match.winner !== null;
                const team1Class = match.winner === match.team1 ? 'winner' : '';
                const team2Class = match.winner === match.team2 ? 'winner' : '';

                html += `
                    <div class="match-card ${isComplete ? 'complete' : ''}">
                        <div class="match-number">Match ${match.number}</div>
                        <div class="match-team team1 ${team1Class}">
                            <span>${match.team1}</span>
                            ${match.score1 !== null ? `<span class="match-score">${match.score1}</span>` : ''}
                        </div>
                        <div class="match-vs">vs</div>
                        <div class="match-team ${team2Class}">
                            <span>${match.team2}</span>
                            ${match.score2 !== null ? `<span class="match-score">${match.score2}</span>` : ''}
                        </div>
                        <div class="score-input-group">
                            <input type="number" id="score1_${match.id}" placeholder="Team 1" min="0" value="${match.score1 !== null ? match.score1 : ''}">
                            <input type="number" id="score2_${match.id}" placeholder="Team 2" min="0" value="${match.score2 !== null ? match.score2 : ''}">
                            <button class="btn-set-score" onclick="setMatchScore(${round.number}, '${match.id}')">Set</button>
                        </div>
                    </div>
                `;
            });

            html += `
                </div>
            `;

            return html;
        }

        function displayMatches(round) {
            let html = `<div class="matches-grid">`;

            round.matches.forEach((match, matchIdx) => {
                const isComplete = match.winner !== null;
                const team1Class = match.winner === match.team1 ? 'winner' : '';
                const team2Class = match.winner === match.team2 ? 'winner' : '';

                html += `
                    <div class="match-card ${isComplete ? 'complete' : ''}">
                        <div class="match-number">Match ${match.number}</div>
                        <div class="match-team team1 ${team1Class}">
                            <span>${match.team1}</span>
                            ${match.score1 !== null ? `<span class="match-score">${match.score1}</span>` : ''}
                        </div>
                        <div class="match-vs">vs</div>
                        <div class="match-team ${team2Class}">
                            <span>${match.team2}</span>
                            ${match.score2 !== null ? `<span class="match-score">${match.score2}</span>` : ''}
                        </div>
                        <div class="score-input-group">
                            <input type="number" id="score1_${match.id}" placeholder="Team 1" min="0" value="${match.score1 !== null ? match.score1 : ''}">
                            <input type="number" id="score2_${match.id}" placeholder="Team 2" min="0" value="${match.score2 !== null ? match.score2 : ''}">
                            <button class="btn-set-score" onclick="setMatchScore(${round.number}, '${match.id}')">Set</button>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            return html;
        }

        function displayStandings() {
            if (!tournament) return;

            const standings = tournament.getStandings();
            let html = `<div class="tournament-display">`;

            tournament.rounds.forEach((round, roundIdx) => {
                const roundMatches = round.matches.filter(m => m.winner !== null);
                if (roundMatches.length === 0) return;

                html += `
                    <div class="round-section">
                        <div class="round-header">Round ${round.number} Standings</div>
                        <table class="standings-table">
                            <thead>
                                <tr>
                                    <th style="width: 50px;">Rank</th>
                                    <th>Team</th>
                                    <th style="width: 60px;">Group</th>
                                    <th style="width: 80px;">Matches</th>
                                    <th style="width: 60px;">Wins</th>
                                    <th style="width: 80px;">Losses</th>
                                    <th style="width: 70px;">Points</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                standings.forEach((entry, idx) => {
                    const rankClass = idx < 3 ? `rank-${idx + 1}` : '';
                    html += `
                        <tr>
                            <td>
                                ${idx < 3 ? `<span class="rank-badge ${rankClass}">${idx + 1}</span>` : `<strong>${idx + 1}</strong>`}
                            </td>
                            <td><strong>${entry.team}</strong></td>
                            <td>${entry.group || '-'}</td>
                            <td>${entry.matches}</td>
                            <td style="color: #51cf66; font-weight: 600;">${entry.wins}</td>
                            <td style="color: #ff6b6b; font-weight: 600;">${entry.losses}</td>
                            <td style="color: #667eea; font-weight: 700; font-size: 1.1em;">${entry.points}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            });

            html += `</div>`;

            document.getElementById('standingsContent').innerHTML = html;
        }

        function setMatchScore(roundNum, matchId) {
            const score1Input = document.getElementById(`score1_${matchId}`);
            const score2Input = document.getElementById(`score2_${matchId}`);

            const score1 = score1Input.value;
            const score2 = score2Input.value;

            if (score1 === '' || score2 === '') {
                alert('Please enter both scores');
                return;
            }

            tournament.setScore(roundNum, matchId, score1, score2);
            displayTournament();
            displayStandings();
            showMessage(`Match scores updated!`, 'success');
        }

        function exportTournament() {
            if (!tournament) return;

            const data = {
                name: tournament.name,
                teams: tournament.teams,
                rounds: tournament.rounds,
                standings: tournament.getStandings(),
                exportedAt: new Date().toISOString()
            };

            const dataStr = JSON.stringify(data, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${tournament.name.replace(/\s+/g, '_')}_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }

        function printTournament() {
            window.print();
        }

        function showMessage(message, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = message;
            document.querySelector('.header').after(div);
            setTimeout(() => div.remove(), 3000);
        }

        // Initialize
        updateRoundFormats();
        resetForm();
    </script>
</body>
</html>
